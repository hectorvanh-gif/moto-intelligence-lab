    <!-- La descripcion que Google usa para el texto bajo el titulo. Solo
         estaban og:description y twitter:description, que sirven cuando
         alguien comparte el enlace, no en resultados de busqueda: sin esta,
         Google improvisa el fragmento con lo que encuentra en la pagina.
         Incluye "motolab249.com" a proposito, porque la marca siempre se
         escribe separada ("Moto Lab 249") y Google marcaba "motolab" como
         termino ausente en las busquedas del propio nombre. -->
    <meta name="description" content="Lo que pasó hoy en el motociclismo: MotoGP, motos eléctricas, doble propósito y lanzamientos. Resumido y al punto, para México. Todos los días en motolab249.com." />

    <meta name="keywords" content="noticias de motos, motociclismo México, MotoGP, motos eléctricas, motos doble propósito, lanzamientos de motos" />

    <!-- Google Search Console: propiedad de prefijo de URL https://motolab249.com. No borrar, la verificacion se revalida. -->
    <meta name="google-site-verification" content="lZtnUZBYDxW6DfnyR0hunVogBE897IukINixnA0X9gk" />

    
    
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://motolab249.com/og-image.jpg?v=2">
    <meta property="og:locale" content="es_MX" />

    <meta name="twitter:card" content="summary_large_image" />
    
    
    <meta name="twitter:image" content="https://motolab249.com/og-image.jpg?v=2">

    <!-- Google solo reconoce rel="icon", "shortcut icon" y "apple-touch-icon";
         "alternate icon" lo ignora, y el PNG de 192 va porque pide un cuadrado
         multiplo de 48 px. El SVG queda primero: es el que usan las pestanas. -->
    <!-- Los iconos cambiaron de nombre a proposito. El archivo anterior
         llevaba el logotipo de Lovable y, aunque se reemplazo por el de la
         marca, Google siguio mostrando el viejo: cachea el icono por URL y
         su indice de favicons se refresca por su cuenta, aparte del de
         paginas. Con un nombre nuevo es un recurso que nunca ha visto y lo
         tiene que bajar. /favicon.ico se queda en su sitio, ya correcto,
         para quien lo pida por convencion. -->
    <!-- El PNG va primero a proposito. El SVG se quito de aqui porque
         dibuja el "ML 249" con font-family="Arial Black": esa fuente
         existe en Windows y macOS, pero no en Linux ni en muchos Android,
         y ahi el logotipo salia con otra tipografia. Un icono que cambia
         segun el aparato no es un icono de marca. El PNG y el .ico son
         pixeles y se ven igual en todos lados, y 192 es multiplo de 48,
         que es lo que Google pide. El SVG se queda en public/ como
         original del diseno.

         25-sep: el icono paso de las letras ML/249 a la moto delineada.
         Nombres nuevos otra vez a proposito, por lo mismo: Google cachea
         el favicon por URL. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-moto-192.png">
    <link rel="icon" href="/logo-moto.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- El canonical y la description los pone react-helmet por pagina (ver
         src/pages/*). Aqui no van, o cada pagina termina con dos. Los og si
         se quedan: los scrapers de redes no ejecutan JS y es lo unico que leen. -->
    <meta property="og:title" content="Noticias de motos en México | Moto Lab 249">
  <meta name="twitter:title" content="Noticias de motos en México | Moto Lab 249">
  <meta property="og:description" content="Lo que pasó hoy en el motociclismo: MotoGP, motos eléctricas, doble propósito y lanzamientos. Resumido y al punto, para México.">
