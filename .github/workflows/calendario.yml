name: Calendario MotoGP

# Cada dia a las 6:00 CST. El calendario oficial mueve horarios y confirma
# los de las rondas que aun no tienen, asi que se relee a diario y solo se
# hace commit cuando algo cambio de verdad.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calendario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Leer el calendario oficial
        run: python scripts/calendario_motogp.py

      - name: Publicar si cambio
        run: |
          if git diff --quiet public/calendario-motogp.json; then
            echo "Sin cambios en el calendario."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/calendario-motogp.json
          git commit -m "Actualiza el calendario de MotoGP"
          git push
