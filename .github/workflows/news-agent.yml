name: Moto News Agent

on:
  schedule:
    # 9:00 AM hora México (CST = UTC-6) todos los días
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run news agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/news_agent.py

      # Avisa en el momento y con la liga al run. El vigia de las 10:30
      # tambien lo detecta, pero este dice cual paso se cayo.
      #
      # vigia.py no usa dependencias, asi que este paso funciona incluso
      # cuando lo que se cayo fue el "Install dependencies" de arriba.
      - name: Avisar si algo se cayo
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/vigia.py --falla "Moto News Agent"
