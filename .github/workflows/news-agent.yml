name: Moto News Agent

on:
  schedule:
    # 9:00 AM hora México (CST = UTC-6) todos los días
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde GitHub
    inputs:
      # Para recuperar dias caidos. El agente mira una ventana fija, asi que
      # lo que no cazo el dia que corrio no lo vuelve a ver: no hay cola de
      # "pendientes". Con esto se le vuelven a pedir a las fuentes.
      dias:
        description: 'Dias hacia atras (1 = normal)'
        required: false
        default: '1'
      maximo:
        description: 'Tope de notas en la corrida'
        required: false
        default: '15'

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run news agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        # El `||` da el respaldo: en la corrida programada no hay inputs y
        # github.event.inputs.dias llega vacio, no ausente.
        run: >
          python scripts/news_agent.py
          --dias ${{ github.event.inputs.dias || '1' }}
          --maximo ${{ github.event.inputs.maximo || '15' }}

      # Avisa en el momento y con la liga al run. El vigia de las 10:30
      # tambien lo detecta, pero este dice cual paso se cayo.
      #
      # vigia.py no usa dependencias, asi que este paso funciona incluso
      # cuando lo que se cayo fue el "Install dependencies" de arriba.
      - name: Avisar si algo se cayo
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/vigia.py --falla "Moto News Agent"
